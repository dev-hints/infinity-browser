<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity New Tab</title>
    <style>
        :root {
            --bg-color: {{window_bg}};
            --card-bg: {{surface}};
            --card-bg-alt: {{surface_alt}};
            --glass-border: {{border}};
            --text-main: {{text}};
            --text-soft: {{text_soft}};
            --text-muted: {{text_muted}};
            --text-accent: {{accent}};
            --text-link: {{link}};
            --hover-color: {{border_soft}};
            --font-ui: '{{font_ui}}', 'Segoe UI', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, var(--card-bg) 0%, var(--bg-color) 100%);
            font-family: var(--font-ui);
            color: var(--text-main);
            overflow: hidden;
        }

        /* Subtle animated background */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, var(--text-soft), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, var(--text-main), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, var(--text-soft), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, var(--text-main), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, var(--text-main), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, var(--text-soft), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: moveStars 100s linear infinite;
            opacity: 0.3;
        }

        @keyframes moveStars {
            from { background-position: 0 0; }
            to { background-position: -10000px 5000px; }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            max-width: 680px;
            padding: 20px;
        }

        .logo-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 2px;
        }

        .logo {
            position: relative;
            display: inline-block;
            font-size: clamp(8.5rem, 22vw, 15rem);
            line-height: 0.82;
            color: transparent;
            background:
                linear-gradient(
                    100deg,
                    var(--text-accent) 0%,
                    var(--text-link) 18%,
                    var(--text-main) 31%,
                    color-mix(in srgb, var(--text-accent) 22%, white) 43%,
                    var(--text-main) 55%,
                    var(--text-link) 74%,
                    var(--text-accent) 100%
                );
            background-size: 260% 100%;
            background-position: 0% 50%;
            -webkit-background-clip: text;
            background-clip: text;
            filter:
                drop-shadow(0 0 5px color-mix(in srgb, var(--text-accent) 55%, transparent))
                drop-shadow(0 0 16px color-mix(in srgb, var(--text-link) 34%, transparent));
            text-shadow:
                0 0 7px color-mix(in srgb, var(--card-bg) 75%, transparent),
                0 0 18px color-mix(in srgb, var(--text-accent) 35%, transparent),
                0 0 34px color-mix(in srgb, var(--text-link) 24%, transparent);
            animation:
                symbolFlow 4.8s linear infinite,
                logoBreathe 4.8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes symbolFlow {
            from { background-position: 0% 50%; }
            to { background-position: 260% 50%; }
        }

        @keyframes logoBreathe {
            0%, 100% { opacity: 0.95; }
            50% { opacity: 1; }
        }

        h1 {
            font-size: 4rem;
            font-weight: 300;
            letter-spacing: 5px;
            margin-bottom: 40px;
            background: linear-gradient(90deg, var(--text-accent), var(--text-link));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(122, 162, 247, 0.2);
        }

        .search-box {
            background: color-mix(in srgb, var(--card-bg) 70%, transparent);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: var(--text-accent);
            box-shadow: 0 8px 32px 0 rgba(122, 162, 247, 0.2);
        }

        .search-input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 1.2rem;
            width: 100%;
            margin-left: 10px;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .quick-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
        }

        .link-item {
            background: color-mix(in srgb, var(--card-bg-alt) 70%, transparent);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            width: 80px;
            height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .link-item:hover {
            background: var(--hover-color);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .link-icon {
            margin-bottom: 5px;
            color: var(--text-main);
        }
        
        .link-item:hover .link-icon {
            color: #7aa2f7;
        }

        .link-name {
            font-size: 0.8rem;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            z-index: 10;
        }

        .footer .brand {
            color: var(--text-accent);
            font-weight: bold;
        }

        .footer .dev {
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="container">
        <div class="logo-wrap" aria-hidden="true">
            <div class="logo">∞</div>
        </div>
        <h1>INFINITY</h1>
        
        <form class="search-box" onsubmit="doSearch(event)">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Search the web..." autofocus autocomplete="off">
        </form>

        <div class="quick-links">

            </a>
            <a href="https://youtube.com" class="link-item">
                <svg class="link-icon" viewBox="0 0 24 24" fill="currentColor" width="28" height="28"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>

            </a>
            <a href="https://reddit.com" class="link-item">
                <svg class="link-icon" viewBox="0 0 24 24" fill="currentColor" width="28" height="28"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.688-.561-1.25-1.249-1.25zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>
                <div class="link-name">Reddit</div>
            </a>
        </div>
    </div>

    <div class="footer">
        <span class="brand">∞ INFINITY BROWSER</span> • Designed & Developed by <span class="dev">StrangeInfinity</span>
    </div>

    <script>
        function doSearch(e) {
            e.preventDefault();
            const q = document.getElementById('searchInput').value.trim();
            if (!q) return;
            window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(q);
        }
    </script>
</body>
</html>
